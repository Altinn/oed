name: Export draw.io diagrams

on:
  push:
    paths:
      - '**.drawio'
      - '**.dio'
      - '.github/workflows/drawio-export.yml'
  workflow_dispatch:

concurrency:
  group: drawio-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The diagram is authored with light-dark() colours, but this drawio
      # build bakes a fixed color-scheme into the SVG. Export both themes and
      # let the README pick via prefers-color-scheme.
      - name: Export light SVG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs
          format: svg
          output: .
          action-mode: all
          remove-page-suffix: true
          embed-svg-fonts: false
          svg-theme: light

      - name: Suffix light SVGs
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            case "$f" in *-light.svg|*-dark.svg) continue;; esac
            mv -- "$f" "${f%.svg}-light.svg"
          done < <(find docs -name '*.svg' -print0)

      - name: Export dark SVG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs
          format: svg
          output: .
          action-mode: all
          remove-page-suffix: true
          embed-svg-fonts: false
          svg-theme: dark

      - name: Suffix dark SVGs
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            case "$f" in *-light.svg|*-dark.svg) continue;; esac
            mv -- "$f" "${f%.svg}-dark.svg"
          done < <(find docs -name '*.svg' -print0)

      - name: Verify both themes were exported
        shell: bash
        run: |
          shopt -s nullglob
          light=(docs/*-light.svg)
          dark=(docs/*-dark.svg)
          echo "light: ${light[*]:-none}"
          echo "dark: ${dark[*]:-none}"
          if [ "${#light[@]}" -eq 0 ] || [ "${#light[@]}" -ne "${#dark[@]}" ]; then
            echo "::error ::expected matching light/dark SVGs under docs/"
            find . -name '*.svg' -not -path './.git/*'
            exit 1
          fi

      - name: Commit generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          file_pattern: '*.svg'
          commit_message: 'chore(docs): regenerate diagram SVGs'
